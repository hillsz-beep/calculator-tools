<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator Tools</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f8;
}

.container {
    max-width: 900px;
    margin: 80px auto;
    padding: 0 20px;
    text-align: center;
}

h1 {
    color: #163b65;
}

.calculator-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 50px;
    margin-top: 25px;
}

.card {
    width: 280px;
    padding: 30px;
    border-radius: 12px;
    background: white;
    box-shadow: 0 5px 15px rgba(0, 0, 0, .12);
}

.card h2 {
    margin-top: 0;
}

.calculator-link {
    display: block;
    border-radius: 10px;
    outline: none;
}

.calculator-image {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: contain;
    border-radius: 8px;
    transition: transform .2s ease, box-shadow .2s ease;
}

.calculator-link:hover .calculator-image,
.calculator-link:focus .calculator-image {
    transform: scale(1.03);
    box-shadow: 0 6px 16px rgba(22, 59, 101, .25);
}
</style>
</head>

<body>
<div class="container">
    <h1>Calculators</h1>
    <p>Select the calculator you would like to use.</p>

    <div class="calculator-grid">
        <div class="card">
            <h2>TI-30XS Scientific Calculator</h2>
            <a class="calculator-link" href="ti30xs.html" aria-label="Open the TI-30XS scientific calculator">
                <img class="calculator-image" src="ti30xs.jpeg" alt="TI-30XS MultiView scientific calculator">
            </a>
        </div>

        <div class="card">
            <h2>TI-84 Graphing Calculator</h2>
            <a class="calculator-link" href="ti84.html" aria-label="Open the TI-84 graphing calculator">
                <img class="calculator-image" src="ti84.jpg" alt="TI-84 Plus CE graphing calculator">
            </a>
        </div>
    </div>
</div>
</body>
</html>
